[project]
name = "yangju-backend"
version = "0.1.0"
description = "탈 수 있을까? 양주 광역버스 만차 예보 AI — GBIS 수집기와 예보 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "tzdata>=2026.5",
    "holidays>=0.106",
    "filelock>=4.0.12",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 Depends/Query 를 기본값으로 쓰는 패턴 허용
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
